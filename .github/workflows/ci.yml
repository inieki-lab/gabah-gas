name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          PGADMIN_PASSWORD: ci-admin-validation-only-not-a-secret
          PGPASSWORD: ci-app-validation-only-not-a-secret
        run: docker compose config --quiet

      - name: Validate deployment and PostgreSQL provisioning scripts
        run: bash -n deploy.sh && bash -n scripts/docker-runtime-smoke.sh && sh -n scripts/provision-postgres-app-role.sh


      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Production dependency boundary regression
        run: npm run test:production-dependency-policy

      - name: Production independent rate-limit secret policy regression
        run: npm run test:production-secret-policy

      - name: Browser storage policy regression
        run: npm run test:browser-storage-policy

      - name: PostgreSQL notification rule persistence and enforcement regression
        run: npm run test:notification-rule-persistence

      - name: PostgreSQL company profile settings persistence regression
        run: npm run test:system-settings-persistence

      - name: Typecheck (lint)
        run: npm run lint

      - name: UAT shared credential mode safety regression
        run: npm run test:uat-credential-mode

      - name: PostgreSQL least-privilege role configuration regression
        run: npm run test:postgres-role-config

      - name: Contract upload resource exhaustion regression
        run: npm run test:upload-security

      - name: Superadmin Administration entry authorization regression
        run: npm run test:superadmin-administration-entry

      - name: PostgreSQL runtime failure latch and atomic snapshot regression
        run: npm run test:runtime-persistence-atomicity

      - name: Dynamic RBAC foundation contract checks
        run: npm run test:dynamic-rbac-foundation

      - name: Vendor and Knowledge Base fail-closed authorization contract
        run: npm run test:vendor-knowledge-rbac-fail-closed

      - name: Dynamic RBAC module scope fail-closed regression
        run: npm run test:rbac-module-scope-fail-closed

      - name: Employee profile capability normalization regression
        run: npm run test:employee-role-normalization

      - name: GA read-only workstation and license menu scope regression
        run: npm run test:ga-license-menu-scope

      - name: Branch migration non-destructive safety check
        run: npm run test:branch-migration-safety

      - name: Asset scope policy regression checks
        run: npm run test:asset-scope-policy

      - name: Asset mutation authorization HTTP status regression
        run: npm run test:asset-mutation-http-status

      - name: Asset lifecycle status cannot be bypassed by generic edits
        run: npm run test:asset-status-workflow-guard

      - name: Asset PATCH validation and persistence rollback regression
        run: npm run test:asset-patch-atomicity

      - name: Asset assignment and lifecycle rollback regression
        run: npm run test:asset-workflow-atomicity

      - name: Physical asset movement rollback regression
        run: npm run test:asset-move-atomicity

      - name: Asset creation rollback regression
        run: npm run test:asset-create-atomicity

      - name: Bulk asset import rollback regression
        run: npm run test:asset-bulk-import-atomicity

      - name: User creation profile validation regression
        run: npm run test:user-create-profile-validation

      - name: Asset owner filter never infers ownership from asset-number prefixes
        run: npm run test:asset-owner-filter

      - name: Contract owner filters and legacy role fallback use owner domains
        run: npm run test:contract-owner-filter

      - name: Contract creation relations and atomic numbering regression
        run: npm run test:contract-creation-relations

      - name: Dashboard asset owner summary uses scoped dynamic owner domains
        run: npm run test:dashboard-owner-summary

      - name: Auditor additional-role deny-write runtime regression
        run: npm run test:auditor-additional-role

      - name: Asset assignment active-user integrity
        run: npm run test:asset-assignment-active-user

      - name: Asset category filter regression checks
        run: npm run test:asset-category-filter

      - name: Asset movement history scope consistency
        run: npm run test:movement-scope

      - name: Per-account login lockout isolation (route contract)
        run: npm run test:login-lockout-scope

      - name: Per-account login lockout isolation (runtime)
        run: npm run test:login-lockout-runtime

      - name: Role navigation policy checks
        run: npm run test:navigation-policy

      - name: Public landing page employee-directory privacy regression
        run: npm run test:public-landing-privacy

      - name: Role dashboard scope checks
        run: npm run test:dashboard-scope

      - name: Dashboard attention data-scope checks
        run: npm run test:dashboard-attention-scope

      - name: Dashboard attention middleware scope consistency
        run: npm run test:dashboard-attention-middleware

      - name: Production build (frontend + server bundle)
        run: npm run build

      - name: Build production Docker image
        run: docker build --tag gabah-gas:ci .

      - name: Validate Docker runtime smoke script
        run: bash -n scripts/docker-runtime-smoke.sh

      - name: Production image runtime smoke (Node 22 + PostgreSQL 17 + uploads volume)
        run: bash scripts/docker-runtime-smoke.sh

      - name: PostgreSQL 17 fresh-database and persistence integration (CR-04/CR-05)
        env:
          GABAH_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/cr04-cr05-verify.mjs

      - name: Shared PostgreSQL API and login rate-limit integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          NODE_ENV: production
          GABAH_RATE_LIMIT_SECRET: ci-shared-rate-limit-independent-secret-2026-only
        run: npm run test:shared-rate-limits

      - name: File-store auth rate-limit memory bound regression
        run: npm run test:auth-rate-limit-memory

      - name: Legacy PostgreSQL contract migration preserves existing records
        env:
          GABAH_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:legacy-contract-migration

      - name: P0 security verification (live HTTP assertions)
        run: node scripts/p0-security-verify.mjs

      - name: Trusted client IP extraction regression
        run: npm run test:trusted-client-ip

      - name: Trusted reverse proxy configuration regression
        run: npm run test:trusted-proxy-config

      - name: User administration validation regression
        run: npm run test:user-admin-validation

      - name: User bulk-import primary-role regression
        run: npm run test:bulk-import

      - name: User CSV import parser regression
        run: npm run test:user-import-parser

      - name: Canonical primary-role policy regression
        run: npm run test:primary-role-policy

      - name: Category master strict boolean regression
        run: npm run test:category-master-boolean

      - name: Job-level strict active flag regression
        run: npm run test:job-level-active

      - name: Notification recipient multi-role RBAC verification
        run: npm run test:notification-recipient-rbac

      - name: Dynamic audit and reconciliation observer route RBAC verification
        run: npm run test:observer-route-rbac

      - name: Organization master strict active regression
        run: npm run test:org-master-active

      - name: Asset numbering rule integrity and deletion safeguards
        run: npm run test:numbering-rules

      - name: Module lifecycle registry contract
        run: npm run test:module-lifecycle-registry

      - name: Module lifecycle API and enforcement contract
        run: npm run test:module-lifecycle-api

      - name: Module lifecycle UI and navigation contract
        run: npm run test:module-lifecycle-ui

      - name: User directory read scope verification
        run: node scripts/rbac-scoping-verify.mjs

      - name: Ticket reporter ownership regression
        run: npm run test:ticket-reporter-ownership

      - name: Ticket reporter transition authorization regression
        run: npm run test:ticket-reporter-transition

      - name: Ticket lifecycle cannot skip operational stages
        run: npm run test:ticket-lifecycle-no-skip

      - name: Ticket workflow durable persistence rollback regression
        run: npm run test:ticket-mutation-atomicity

      - name: Server-authoritative per-ticket action regression
        run: npm run test:ticket-allowed-actions

      - name: Ticket comments API authorization and persistence contract
        run: npm run test:ticket-comments-api

      - name: Dynamic ticket assignment authorization and UI contract
        run: npm run test:ticket-assignment-api

      - name: PIBC ME ticket queue and unit-scope regression
        run: npm run test:pibc-me-ticket-queue

      - name: Direct IT Support ticket routing regression
        run: npm run test:ticket-direct-it-routing

      - name: Ticket related-asset visibility regression
        run: npm run test:ticket-related-asset-scope

      - name: Loan API/UI status contract regression
        run: npm run test:loan-status-contract

      - name: Loan borrower self-return authorization regression
        run: npm run test:loan-borrower-return

      - name: Effective permission UI regression (Superadmin + wildcard)
        run: npm run test:effective-permission-ui

      - name: Loan authorization and state transitions
        run: npm run test:loan-authz

      - name: Loan mutation durable persistence and rollback regression
        run: npm run test:loan-mutation-atomicity

      - name: Overdue loan return runtime regression
        run: npm run test:loan-overdue-return

      - name: Loan datetime-local API contract regression
        run: npm run test:loan-datetime-contract

      - name: Loan Jakarta timezone consistency regression
        run: npm run test:loan-timezone

      - name: Loanable asset pool UI eligibility regression
        run: npm run test:loanable-pool-ui

      - name: Meeting room reservation regression
        run: npm run test:meeting-room

      - name: Room and facility durable persistence regression
        run: npm run test:room-domain-persistence

      - name: Room and facility mutation rollback regression
        run: npm run test:room-mutation-rollback

      - name: Meeting room additional-role UI regression
        run: npm run test:room-capability-ui

      - name: Report KPI data-integrity regression
        run: npm run test:report-kpi-integrity

      - name: Ticket resolution notes validation
        run: npm run test:ticket-resolution-notes

      - name: Telegram chat ID response redaction
        run: npm run test:telegram-chat-id-redaction

      - name: Contract renewal linkage integrity
        run: npm run test:contract-renewal-integrity

      - name: Immutable ticket and personal-record ownership regression
        run: npm run test:ticket-owner-id-only

      - name: Maintenance seed relation integrity
        run: npm run test:maintenance-seed-relations

      - name: Contract creation and update relation integrity
        run: npm run test:contract-creation-relations

      - name: Contract reminder scheduler advisory-lock lifecycle regression
        run: npm run test:reminder-scheduler-lock

      - name: Vendor active-contract count server authority
        run: npm run test:vendor-contract-count

      - name: Organization model regression
        run: npm run test:org-model

      - name: RPC/PIBC location label and legacy owner safety regression
        run: npm run test:rpc-location-label

      - name: Division reference integrity regression
        run: npm run test:division-reference-integrity

      - name: Asset managing-unit regression
        run: npm run test:t2b1

      - name: Asset location master regression
        run: npm run test:t2b2

      - name: Asset category master regression
        run: npm run test:t2b3

      - name: Sidebar menu API connectivity
        run: node scripts/menu-connectivity-verify.mjs

      - name: Maintenance authorization verification (live HTTP assertions)
        run: npm run test:maintenance-authz

      - name: Maintenance dynamic-scope consistency
