name: CI

on:
  push:
    branches: [main, fix/ui-overflow-and-responsive-polish]
  pull_request:
    branches: [main, feat/gabah-visual-redesign-v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          PGPASSWORD: ci-validation-only-not-a-secret
        run: docker compose config --quiet

      - name: Validate deployment shell script
        run: bash -n deploy.sh


      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Responsive layout and overflow safeguards
        run: npm run test:responsive-layout

      - name: Dynamic RBAC foundation contract checks
        run: npm run test:dynamic-rbac-foundation

      - name: Employee profile capability normalization regression
        run: npm run test:employee-role-normalization

      - name: Branch migration non-destructive safety check
        run: npm run test:branch-migration-safety

      - name: Asset scope policy regression checks
        run: npm run test:asset-scope-policy

      - name: Asset owner filter never infers ownership from asset-number prefixes
        run: npm run test:asset-owner-filter

      - name: Contract owner filters and legacy role fallback use owner domains
        run: npm run test:contract-owner-filter

      - name: Dashboard asset owner summary uses scoped dynamic owner domains
        run: npm run test:dashboard-owner-summary

      - name: Auditor additional-role deny-write runtime regression
        run: npm run test:auditor-additional-role

      - name: Asset assignment active-user integrity
        run: npm run test:asset-assignment-active-user

      - name: Asset category filter regression checks
        run: npm run test:asset-category-filter

      - name: Asset movement history scope consistency
        run: npm run test:movement-scope

      - name: Per-account login lockout isolation (route contract)
        run: npm run test:login-lockout-scope

      - name: Per-account login lockout isolation (runtime)
        run: npm run test:login-lockout-runtime

      - name: Role navigation policy checks
        run: npm run test:navigation-policy

      - name: Role dashboard scope checks
        run: npm run test:dashboard-scope

      - name: Employee-facing dashboard classification regression
        run: npm run test:dashboard-audience

      - name: Dashboard attention data-scope checks
        run: npm run test:dashboard-attention-scope

      - name: Dashboard attention middleware scope consistency
        run: npm run test:dashboard-attention-middleware

      - name: Production build (frontend + server bundle)
        run: npm run build

      - name: Build production Docker image
        run: docker build --tag gabah-gas:ci .

      - name: Validate Docker runtime smoke script
        run: bash -n scripts/docker-runtime-smoke.sh

      - name: Production image runtime smoke (Node 22 + PostgreSQL 17 + uploads volume)
        run: bash scripts/docker-runtime-smoke.sh

      - name: PostgreSQL 17 fresh-database and persistence integration (CR-04/CR-05)
        env:
          GABAH_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/cr04-cr05-verify.mjs

      - name: P0 security verification (live HTTP assertions)
        run: node scripts/p0-security-verify.mjs

      - name: Trusted client IP extraction regression
        run: npm run test:trusted-client-ip

      - name: User administration validation regression
        run: npm run test:user-admin-validation

      - name: User bulk-import primary-role regression
        run: npm run test:bulk-import

      - name: User CSV import parser regression
        run: npm run test:user-import-parser

      - name: Canonical primary-role policy regression
        run: npm run test:primary-role-policy

      - name: Category master strict boolean regression
        run: npm run test:category-master-boolean

      - name: Job-level strict active flag regression
        run: npm run test:job-level-active

      - name: Notification recipient multi-role RBAC verification
        run: npm run test:notification-recipient-rbac

      - name: Organization master strict active regression
        run: npm run test:org-master-active

      - name: Asset numbering rule integrity and deletion safeguards
        run: npm run test:numbering-rules

      - name: Module lifecycle registry contract
        run: npm run test:module-lifecycle-registry

      - name: Module lifecycle API and enforcement contract
        run: npm run test:module-lifecycle-api

      - name: Module lifecycle UI and navigation contract
        run: npm run test:module-lifecycle-ui

      - name: User directory read scope verification
        run: node scripts/rbac-scoping-verify.mjs

      - name: Ticket reporter ownership regression
        run: npm run test:ticket-reporter-ownership

      - name: Ticket related-asset visibility regression
        run: npm run test:ticket-related-asset-scope

      - name: Loan authorization and state transitions
        run: npm run test:loan-authz

      - name: Loanable asset pool UI eligibility regression
        run: npm run test:loanable-pool-ui

      - name: Meeting room reservation regression
        run: npm run test:meeting-room

      - name: Meeting room additional-role UI regression
        run: npm run test:room-capability-ui

      - name: Report KPI data-integrity regression
        run: npm run test:report-kpi-integrity

      - name: Ticket resolution notes validation
        run: npm run test:ticket-resolution-notes

      - name: Telegram chat ID response redaction
        run: npm run test:telegram-chat-id-redaction

      - name: Contract renewal linkage integrity
        run: npm run test:contract-renewal-integrity

      - name: Vendor active-contract count server authority
        run: npm run test:vendor-contract-count

      - name: Organization model regression
        run: npm run test:org-model

      - name: Division reference integrity regression
        run: npm run test:division-reference-integrity

      - name: Asset managing-unit regression
        run: npm run test:t2b1

      - name: Asset location master regression
        run: npm run test:t2b2

      - name: Asset category master regression
        run: npm run test:t2b3

      - name: Sidebar menu API connectivity
        run: node scripts/menu-connectivity-verify.mjs

      - name: Maintenance authorization verification (live HTTP assertions)
        run: npm run test:maintenance-authz

      - name: Maintenance dynamic-scope consistency
        run: npm run test:maintenance-dynamic-scope

      - name: Maintenance vendor reference integrity
        run: npm run test:maintenance-vendor-reference

      - name: Maintenance input validation
        run: npm run test:maintenance-input-validation
