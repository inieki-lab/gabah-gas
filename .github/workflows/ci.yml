name: CI

on:
  push:
    branches: [main, ai/hermes/authorization-endpoint-audit]
  pull_request:
    branches: [main, ai/hermes/authorization-endpoint-audit]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          PGPASSWORD: ci-validation-only-not-a-secret
        run: docker compose config --quiet

      - name: Validate deployment shell script
        run: bash -n deploy.sh


      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Dynamic RBAC foundation contract checks
        run: npm run test:dynamic-rbac-foundation

      - name: Notification recipient authorization contract checks
        run: npm run test:notification-recipient-rbac

      - name: Branch migration non-destructive safety check
        run: npm run test:branch-migration-safety

      - name: Asset scope policy regression checks
        run: npm run test:asset-scope-policy

      - name: Role navigation policy checks
        run: npm run test:navigation-policy

      - name: Role dashboard scope checks
        run: npm run test:dashboard-scope

      - name: Production build (frontend + server bundle)
        run: npm run build

      - name: Build production Docker image
        run: docker build --tag gabah-gas:ci .

      - name: Validate Docker runtime smoke script
        run: bash -n scripts/docker-runtime-smoke.sh

      - name: Production image runtime smoke (Node 22 + PostgreSQL 17 + uploads volume)
        run: bash scripts/docker-runtime-smoke.sh

      - name: PostgreSQL 17 fresh-database and persistence integration (CR-04/CR-05)
        env:
          GABAH_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/cr04-cr05-verify.mjs

      - name: P0 security verification (live HTTP assertions)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_p0_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_p0_ci
          node scripts/p0-security-verify.mjs

      - name: User directory read scope verification
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_rbac_scope_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_rbac_scope_ci
          node scripts/rbac-scoping-verify.mjs

      - name: Loan authorization and state transitions
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: gabah_loan_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_loan_ci
          npm run test:loan-authz

      - name: Cross-department ticket creation regression
        run: npm run test:ticket-cross-department

      - name: Contract update mass-assignment regression
        run: npm run test:contract-mass-assignment

      - name: Meeting room reservation regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_meeting_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_meeting_ci
          npm run test:meeting-room

      - name: Organization model regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_org_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_org_ci
          npm run test:org-model

      - name: Asset managing-unit regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_t2b1_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_t2b1_ci
          npm run test:t2b1

      - name: Asset location master regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_t2b2_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_t2b2_ci
          npm run test:t2b2

      - name: Asset category master regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_t2b3_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_t2b3_ci
          npm run test:t2b3

      - name: Sidebar menu API connectivity
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gabah_menu_ci
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres gabah_menu_ci
          node scripts/menu-connectivity-verify.mjs

      - name: Maintenance authorization verification (live HTTP assertions)
        run: npm run test:maintenance-authz
