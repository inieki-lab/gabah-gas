name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Dynamic RBAC foundation contract checks
        run: npm run test:dynamic-rbac-foundation

      - name: Production build (frontend + server bundle)
        run: npm run build

      - name: P0 security verification (37 live HTTP assertions)
        run: node scripts/p0-security-verify.mjs

      - name: Maintenance authorization verification (live HTTP assertions)
        run: node scripts/maintenance-authz-verify.mjs
