services:
  # 1. Database PostgreSQL 17
  database:
    image: postgres:17-alpine
    container_name: gabah_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-gabah_db}
      POSTGRES_USER: ${PGUSER:-gabah_user}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gabah_network
    ports:
      - "5432:5432"

  # 2. GABAH Enterprise Application (React + Express API)
  app:
    image: node:20-alpine
    container_name: gabah_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${PGUSER:-gabah_user}:${PGPASSWORD}@database:5432/${PGDATABASE:-gabah_db}
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-gabah_db}
      PGUSER: ${PGUSER:-gabah_user}
      PGPASSWORD: ${PGPASSWORD}
    command: sh -c "npm install && npm run build && npm start"
    depends_on:
      - database
    networks:
      - gabah_network

volumes:
  postgres_data:
    driver: local

networks:
  gabah_network:
    driver: bridge
