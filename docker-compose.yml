services:
  database:
    image: postgres:17-alpine
    container_name: gabah_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-gabah_db}
      POSTGRES_USER: ${PGADMIN_USER:-gabah_admin}
      POSTGRES_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD wajib diisi di .env sebelum menjalankan docker compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gabah_network
    ports:
      - "127.0.0.1:${GABAH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGADMIN_USER:-gabah_admin} -d ${PGDATABASE:-gabah_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  database-provisioner:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/scripts/provision-postgres-app-role.sh"]
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-gabah_db}
      PGADMIN_USER: ${PGADMIN_USER:-gabah_admin}
      PGADMIN_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD wajib diisi di .env sebelum menjalankan docker compose}
      PGAPP_USER: ${PGUSER:-gabah_app}
      PGAPP_PASSWORD: ${PGPASSWORD:?PGPASSWORD wajib diisi di .env sebelum menjalankan docker compose}
    volumes:
      - ./scripts/provision-postgres-app-role.sh:/scripts/provision-postgres-app-role.sh:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - gabah_network
    restart: "no"

  app:
    image: gabah-gas:${GABAH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gabah_app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${GABAH_WEB_PORT:-80}:3000"
    environment:
      NODE_ENV: production
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-gabah_db}
      PGUSER: ${PGUSER:-gabah_app}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD wajib diisi di .env sebelum menjalankan docker compose}
      GABAH_INITIAL_ADMIN_PASSWORD: ${GABAH_INITIAL_ADMIN_PASSWORD:-}
      GABAH_INITIAL_USER_PASSWORD: ${GABAH_INITIAL_USER_PASSWORD:-}
      GABAH_APP_MODE: ${GABAH_APP_MODE:-production}
      GABAH_TEST_PASSWORD: ${GABAH_TEST_PASSWORD:-}
      GABAH_RATE_LIMIT_SECRET: ${GABAH_RATE_LIMIT_SECRET:-}
      GABAH_TRUST_PROXY: ${GABAH_TRUST_PROXY:-}
      GABAH_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      database-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - gabah_network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  gabah_network:
    driver: bridge
