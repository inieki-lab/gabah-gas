services:
  # 1. Database PostgreSQL 17
  database:
    image: postgres:17-alpine
    container_name: gabah_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabah_db
      POSTGRES_USER: gabah_user
      POSTGRES_PASSWORD: PasswordBumd123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gabah_network
    ports:
      - "5432:5432"

  # 2. GABAH Enterprise Application (React + Express API)
  app:
    image: node:20-alpine
    container_name: gabah_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
    command: sh -c "npm install && npm run build && npm start"
    depends_on:
      - database
    networks:
      - gabah_network

volumes:
  postgres_data:
    driver: local

networks:
  gabah_network:
    driver: bridge
